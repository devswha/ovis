# Licence annotations for files that cannot carry their own, in the format of the REUSE Specification 3.3
# (https://reuse.software). Only the format is borrowed: the rest of this repository is not annotated that way, and
# the licence's text is LICENSES/ACCOUNT-LAYER.md, not under the name that specification asks for
# (LICENSES/FSL-1.1-MIT.txt), so `reuse lint` does not pass here.
# The account layer's JSON test vectors hold no comment and must not gain a field: two implementations and a reader
# read them byte for byte. Their licence is the account layer's, LICENSES/ACCOUNT-LAYER.md; every other file of the
# account layer starts with its own SPDX line (scripts/account-layer-licence.test.ts checks both).
version = 1

[[annotations]]
path = "shared/account-list-vectors/**"
SPDX-FileCopyrightText = "2026 devswha"
SPDX-License-Identifier = "FSL-1.1-MIT"
