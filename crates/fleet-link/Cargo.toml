[package]
name = "ovis-link"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "The Ovis fleet link agent: dials home to a fleet controller over Noise NK and protected records (docs/fleet-link.md)"

[lib]
name = "ovis_link"
path = "src/lib.rs"

[[bin]]
name = "ovis-link"
path = "src/main.rs"

# Pinned exactly: a second implementation of the relay handshake moves only with a reviewed change.
[dependencies]
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "=0.13.0"
# The invite key of ENROLL (docs/fleet-link.md section 4): an Ed25519 key derived from the invite's secret.
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
# The machine key's ECDSA P-256 signature over AUTH (docs/fleet-link.md section 1.5): RFC 6979, SHA-256.
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
# The mux's metadata frames and the selftest's configuration are JSON; `serde` alone gives the visitor
# that refuses a duplicate key, as shared/relay-mux.ts parseMetadata does.
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_json = "=1.0.154"
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "=3.0.0", features = ["getrandom", "static_secrets", "zeroize"] }
# Already in the graph through x25519-dalek and chacha20poly1305; named so the crate's own key
# buffers are cleared on drop without `unsafe`.
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

# Already in the graph through x25519-dalek; named for the backoff's jitter and the keepalive probes.
getrandom = { version = "=0.4.3", default-features = false }
# The carriers of `ovis-link run` (todo 24, src/dial.rs): WebSocket over TCP, and TLS for a `wss:` relay.
# rustls with ring's primitives (no OpenSSL, no system library) verifies the relay's certificate
# against Mozilla's root store as webpki-roots ships it; the controller itself is proven by Noise
# against the key pinned in fleet.json, whichever carrier it comes through.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
webpki-roots = "=1.0.12"

# Already in the graph through getrandom; named for O_NOFOLLOW, O_NONBLOCK and O_NOCTTY when a private
# file is opened (src/private_file.rs), which std does not export.
[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.191", default-features = false }
# One thread per carrier waits on its socket and on the agent's wake-up at once (src/dial.rs).
mio = { version = "=1.2.4", default-features = false, features = ["os-poll", "os-ext"] }

[profile.dev]
panic = "abort"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
