[package]
name = "ovis-acp-keeper"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Holds an ACP agent on pipes, numbers every message into a file, serves replay clients, draws a shared terminal screen and arbitrates approvals"

[[bin]]
name = "ovis-acp-keeper"
path = "src/main.rs"

[dependencies]
serde_json = "1"
memchr = "2"
tokio = { version = "1", features = ["rt", "net", "process", "io-util", "signal", "sync", "time", "macros"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
