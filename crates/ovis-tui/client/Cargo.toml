[package]
name = "ovis-tui-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The local Ovis server as the terminal client reads it, and the inbox as a screen: state, keys and drawing"

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
unicode-width = "0.2"
ureq = { version = "3", default-features = false }

[[test]]
name = "ui"
path = "tests/ui/main.rs"

[[test]]
name = "child_env"
path = "tests/child_env.rs"
harness = false
