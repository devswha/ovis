apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    buildFeatures { compose = true }
    sourceSets {
        main.res.srcDir '../fork/assistant/res'
        main.assets.srcDir '../fork/assistant/assets'
        main.java.srcDir '../fork/assistant/java'
        test.java.srcDir '../fork/assistant/test'
    }
    kotlinOptions { jvmTarget = '21' }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.07.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2'
    implementation 'androidx.savedstate:savedstate-ktx:1.3.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
