name: Beta
# Publishes a beta build of every commit on main whose CI passed, for the PCs that opted into the beta
# update channel (OVIS_UPDATE_CHANNEL=beta, or `beta` in the `update-channel` file of the state dir;
# docs/guide.md#updates). Nobody else is offered one: a stable updater takes plain vX.Y.Z tags only.
#
# - tag: tags the commit vX.Y.Z-beta.N, where X.Y.Z is the version main is heading for (package.json's,
#   or its next patch once that version is released) and N counts up per version. The server's updater
#   on the beta channel builds and installs it like a release. A commit that an existing v* tag already
#   contains (a CI run that finished after a newer one) gets none.
# - desktop, desktop-publish: builds the desktop app (app/electron) at that version and uploads it with
#   its beta-*.yml feed files to the rolling `desktop-beta` prerelease, which the app reads on the beta
#   channel (app/electron/src/updates.ts, BETA_FEED). A prerelease is never GitHub's latest, so the
#   stable feed (releases/latest/download) never sees it. Linux x64 and arm64 AppImages, and an arm64
#   Mac build, signed and notarized once the repository variable DESKTOP_MAC_SIGN is 'true' (a Mac app
#   updates itself only when signed).
#
# The beta tags are made here only: never push a v* tag by hand.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# one beta at a time, in order: a newer commit's run waits instead of cancelling the one building
concurrency:
  group: beta
  cancel-in-progress: false
env:
  STABLE_FEED: https://github.com/${{ github.repository }}/releases/latest/download
jobs:
  tag:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Pick the beta version
        id: version
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          git fetch --quiet --force --tags origin
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main." >&2
            exit 1
          fi
          # a newer commit's beta (or a release) already brings this one
          if [ -n "$(git tag --contains "$SHA" --list 'v*')" ]; then
            echo "A v* tag already contains $SHA; no beta."
            exit 0
          fi
          version=$(git show "$SHA:package.json" | jq -r .version)
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::package.json's version '$version' is not X.Y.Z." >&2
            exit 1
          fi
          # once X.Y.Z is released, main is heading for the next patch
          if git rev-parse --quiet --verify "refs/tags/v$version" >/dev/null; then
            version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          fi
          last=$(git tag --list "v$version-beta.*" | sed -n "s/^v$version-beta\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)
          beta="$version-beta.$(( ${last:-0} + 1 ))"
          {
            echo "tag=v$beta"
            echo "version=$beta"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"
      - name: Tag the beta
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$SHA" >/dev/null
          echo "Tagged $SHA as $TAG." >> "$GITHUB_STEP_SUMMARY"
  desktop:
    name: desktop (${{ matrix.target }})
    needs: tag
    if: needs.tag.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: darwin-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the client's packages
        run: bun install --frozen-lockfile
      - name: Install the app's packages
        working-directory: app/electron
        run: bun install --frozen-lockfile
      # the app and the server it carries say the beta's version; electron-builder names its feed
      # files after the version's channel (beta-mac.yml, beta-linux.yml, beta-linux-arm64.yml)
      - name: Set the beta version
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          jq --arg version "$VERSION" '.version = $version' package.json > package.json.beta
          mv package.json.beta package.json
      - name: Mac signing
        id: sign
        if: startsWith(matrix.target, 'darwin-') && vars.DESKTOP_MAC_SIGN == 'true'
        env:
          MAC_NOTARY_KEY_P8: ${{ secrets.MAC_NOTARY_KEY_P8 }}
          HAS_MAC_DEVELOPER_ID_P12: ${{ secrets.MAC_DEVELOPER_ID_P12 != '' }}
          HAS_MAC_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD != '' }}
          HAS_MAC_NOTARY_KEY_P8: ${{ secrets.MAC_NOTARY_KEY_P8 != '' }}
          HAS_MAC_NOTARY_KEY_ID: ${{ secrets.MAC_NOTARY_KEY_ID != '' }}
          HAS_MAC_NOTARY_ISSUER: ${{ secrets.MAC_NOTARY_ISSUER != '' }}
        run: |
          missing=""
          for name in MAC_DEVELOPER_ID_P12 MAC_DEVELOPER_ID_P12_PASSWORD MAC_NOTARY_KEY_P8 MAC_NOTARY_KEY_ID MAC_NOTARY_ISSUER; do
            has="HAS_$name"; [ "${!has}" = true ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::DESKTOP_MAC_SIGN is on, but these repository secrets are not set:$missing." >&2
            exit 1
          fi
          (umask 077 && printf '%s' "$MAC_NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary-key.p8")
          echo "key=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_OUTPUT"
          echo "on=true" >> "$GITHUB_OUTPUT"
      - name: Build ${{ matrix.target }}
        working-directory: app/electron
        env:
          # built with the stable feed: an app that leaves the beta channel waits there for the release
          OVIS_UPDATE_FEED: ${{ env.STABLE_FEED }}
          OVIS_RELEASE_TAG: ${{ needs.tag.outputs.tag }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.sign.outputs.on == 'true' && 'true' || 'false' }}
          CSC_LINK: ${{ steps.sign.outputs.on == 'true' && secrets.MAC_DEVELOPER_ID_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ steps.sign.outputs.on == 'true' && secrets.MAC_DEVELOPER_ID_P12_PASSWORD || '' }}
          APPLE_API_KEY: ${{ steps.sign.outputs.key }}
          APPLE_API_KEY_ID: ${{ steps.sign.outputs.on == 'true' && secrets.MAC_NOTARY_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.sign.outputs.on == 'true' && secrets.MAC_NOTARY_ISSUER || '' }}
        run: bun run dist
      - name: Remove the notary key
        if: always() && steps.sign.outputs.key != ''
        env:
          KEY: ${{ steps.sign.outputs.key }}
        run: rm -f "$KEY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ovis-desktop-beta-${{ matrix.target }}
          path: |
            app/electron/dist/Ovis-*
            app/electron/dist/beta*.yml
          if-no-files-found: error
  # the write token runs no repository code: it only uploads what the builds made
  desktop-publish:
    needs: [tag, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ovis-desktop-beta-*
          merge-multiple: true
          path: ${{ runner.temp }}/beta
      - name: Upload to the desktop-beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.tag.outputs.version }}
          SHA: ${{ needs.tag.outputs.sha }}
        run: |
          cd "$RUNNER_TEMP/beta"
          for feed in beta-linux.yml beta-linux-arm64.yml beta-mac.yml; do
            test -s "$feed" || { echo "::error::No $feed among the builds." >&2; exit 1; }
          done
          if ! gh release view desktop-beta >/dev/null 2>&1; then
            gh release create desktop-beta --prerelease --target "$SHA" --title "Desktop app beta" \
              --notes "The latest beta build of the desktop app, from main. It updates itself here only on the beta update channel."
          fi
          # the feed files last: an app never reads a feed whose files are missing
          find . -maxdepth 1 -type f ! -name 'beta*.yml' -print0 | xargs -0 gh release upload desktop-beta --clobber
          gh release upload desktop-beta beta*.yml --clobber
          gh release edit desktop-beta --prerelease --title "Desktop app beta $VERSION"
          # the builds of earlier betas go once the feed names the new ones
          gh release view desktop-beta --json assets --jq '.assets[].name' | while read -r name; do
            [ -e "$name" ] || gh release delete-asset desktop-beta "$name" --yes
          done
          echo "Published the desktop app $VERSION to desktop-beta." >> "$GITHUB_STEP_SUMMARY"
